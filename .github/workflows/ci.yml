name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['26', '27']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.23'
      - name: Compile
        run: rebar3 compile
      - name: Run dialyzer
        run: rebar3 dialyzer
      - name: Run EUnit tests
        run: rebar3 eunit
